name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -p "test_*.py" -q
      - run: python -X utf8 -m unittest discover -s dynamic -p "test_*.py" -q
      - run: node --test dynamic/test_cdp_observe.cjs dynamic/test_webview_probe.cjs
